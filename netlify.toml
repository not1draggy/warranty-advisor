[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Static assets are immutable — Vite fingerprints every filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# SPA fallback. Function routes declared via `config.path` are matched first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
